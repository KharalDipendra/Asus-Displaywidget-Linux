[package]
name = "asusdisplay"
version = "0.2.0"
edition = "2024"
description = "Control ASUS monitors over DDC/CI on Linux and Windows"
license = "MIT"
repository = "https://github.com/KharalDipendra/Asus-Displaywidget-Linux"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
] }

[profile.release]
lto = true
opt-level = "s"
strip = true
